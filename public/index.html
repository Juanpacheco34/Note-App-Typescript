<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Notes App</title>
</head>
<body>
  <header class="header">
    <h1 class="page-name">Notes App</h1>
  </header>

  <main class="notes-main">
    <ul class="note-list">

      <li class="form-item">
        <form class="note-form">
          <input type="text" class="note-title" placeholder="Nueva Nota"  name="new-note">
          <button class="create-btn" type="submit">+</button>
        </form>
      </li>

    </ul>
  </main>

  <script src="bundle.js" type="module"></script>
</body>
</html>
